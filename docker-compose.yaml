version: "3.5"
services:
  mysql:
    container_name: habittracker_mysql
    image: mariadb:10.7
    restart: always
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - ./data/db/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: habittracker_nginx
    hostname: nginx
    ports:
      - ${HTTP_PORT}:80
    volumes:
      - ./etc/ssl:/etc/ssl
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www:rw
      - ./etc/nginx/:/var/log/nginx:rw
    restart: always
    depends_on:
      - mysql
      - php
  # ==============================================================================
  php:
    build:
      context: ./etc/php
      dockerfile: Dockerfile
      args:
        COMPOSE_USER_ID: ${COMPOSE_USER_ID}
        COMPOSE_GROUP_ID: ${COMPOSE_GROUP_ID}
    container_name: habittracker_php
    hostname: php
    environment:
      PHP_IDE_CONFIG: serverName=php
      XDEBUG_IDE_KEY: PHPSTORM
      XDEBUG_REMOTE_AUTOSTART: '1'
      XDEBUG_REMOTE_HOST: ${XDEBUG_REMOTE_HOST}
      XDEBUG_REMOTE_PORT: ${XDEBUG_REMOTE_PORT}
    volumes:
      - ./etc/ssl:/etc/ssl
      - .:/var/www
    links:
      - mysql
  # ==============================================================================
  mailhog:
    container_name: habittracker_mailhog
    hostname: mailhog
    image: mailhog/mailhog
    ports:
      - ${MAILER_PORT}:1025
      - ${HTTP_MAILER_PORT}:8025
  # ==============================================================================
  redis:
    image: redis:alpine
    container_name: habittracker_redis
    ports:
      - ${REDIS_PORT}:6379

